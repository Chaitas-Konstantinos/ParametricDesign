[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Chaitas-Konstantinos/ParametricDesign"

[workspace.dependencies]
pd-core = { path = "crates/pd-core" }
pd-export = { path = "crates/pd-export" }
pd-render = { path = "crates/pd-render" }
pd-skills = { path = "crates/pd-skills" }
pd-mcp = { path = "crates/pd-mcp" }
pd-app = { path = "crates/pd-app" }
manifold-rust = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.dev.package.manifold-rust]
opt-level = 3
