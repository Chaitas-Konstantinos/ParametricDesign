[package]
name = "parametricdesign"
description = "ParametricDesign desktop app"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"

# Built separately from the main workspace: it needs the platform webview.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
pd-app = { path = "../../../crates/pd-app" }
pd-library = { path = "../../../crates/pd-library" }
pd-skills = { path = "../../../crates/pd-skills" }

[profile.dev.package.manifold-rust]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
