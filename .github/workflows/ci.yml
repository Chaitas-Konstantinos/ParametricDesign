name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: Engine, CLI, MCP and skills (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - name: WebAssembly build
        run: cargo build -p pd-wasm --release --target wasm32-unknown-unknown

  windows:
    name: Windows app and pd.exe
    runs-on: windows-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pd command line (MCP server)
        run: cargo build --release -p pd-cli
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run wasm
      - name: Desktop installer (with pd.exe installed next to the app)
        working-directory: apps/desktop
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp ../../target/release/pd.exe src-tauri/binaries/pd-x86_64-pc-windows-msvc.exe
          npx tauri build --config src-tauri/tauri.installer.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: parametricdesign-windows
          path: |
            target/release/pd.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
