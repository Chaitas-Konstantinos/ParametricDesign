name: Windows installer

# Builds the Windows installer (MSI and setup .exe, with pd.exe inside).
# Only runs when started by hand: Actions -> Windows installer -> Run workflow.
# The repository is private, so Windows minutes count double against the free
# allowance; this used to run on every push.
on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows app and pd.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pd command line (MCP server)
        run: cargo build --release -p pd-cli
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run wasm
      - name: Desktop installer (with pd.exe installed next to the app)
        working-directory: apps/desktop
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp ../../target/release/pd.exe src-tauri/binaries/pd-x86_64-pc-windows-msvc.exe
          npx tauri build --config src-tauri/tauri.installer.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: parametricdesign-windows
          retention-days: 14
          path: |
            target/release/pd.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
